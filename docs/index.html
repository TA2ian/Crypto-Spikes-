<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تتبع العملات الرقمية</title>
    <!-- استيراد خط عربي جميل وتصميم حديث -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-cyan: #06b6d4;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.4rem;
            color: var(--accent-cyan);
            margin-bottom: 5px;
        }
        .timestamp {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            flex: 1;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-box span {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .filters {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .filter-btn.active {
            background-color: var(--accent-cyan);
            color: #000;
            font-weight: bold;
        }
        .signal-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-right: 4px solid var(--accent-cyan);
        }
        .signal-card.bearish {
            border-right-color: var(--accent-red);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .symbol {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
        }
        .card-body p {
            margin: 4px 0;
            font-size: 0.9rem;
        }
        .targets {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>لوحة رصد الإشارات والتنبيهات</h1>
        <div class="timestamp" id="update-time">جاري تحديث البيانات...</div>
    </header>

    <div class="stats-container">
        <div class="stat-box">
            إشارات الصعود
            <span id="bullish-count" style="color: var(--accent-green);">0</span>
        </div>
        <div class="stat-box">
            تحذيرات الهبوط
            <span id="bearish-count" style="color: var(--accent-red);">0</span>
        </div>
    </div>

    <!-- أزرار الفلترة حسب الفريم أو الحالة -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterSignals('all', this)">الكل</button>
        <button class="filter-btn" onclick="filterSignals('1h', this)">1h</button>
        <button class="filter-btn" onclick="filterSignals('4h', this)">4h</button>
        <button class="filter-btn" onclick="filterSignals('1d', this)">1d</button>
        <button class="filter-btn" onclick="filterSignals('3d', this)">3d</button>
        <button class="filter-btn" onclick="filterSignals('bearish', this)">التحذيرات الهابطة</button>
    </div>

    <!-- حاوية عرض البطاقات -->
    <div id="signals-container">
        <!-- يتم تعبئتها ديناميكياً عبر الجافاسكريبت -->
    </div>

    <script>
        let marketData = {};

        async function loadMarketData() {
            try {
                // جلب البيانات من الملف الموجود في نفس المجلد
                const response = await fetch('./market_status.json?' + new Date().getTime());
                if (!response.ok) throw new Error('فشل في جلب ملف البيانات');
                marketData = await response.json();
                
                // تحديث العدادات والوقت
                document.getElementById('bullish-count').textContent = marketData.bullish_signals_count || 0;
                document.getElementById('bearish-count').textContent = marketData.bearish_signals_count || 0;
                
                if (marketData.timestamp) {
                    const dateObj = new Date(marketData.timestamp);
                    document.getElementById('update-time').textContent = `آخر تحديث: ${dateObj.toLocaleString('ar-AE')}`;
                } else {
                    document.getElementById('update-time').textContent = 'آخر تحديث: متوفر';
                }

                renderSignals('all');
            } catch (error) {
                console.error(error);
                document.getElementById('signals-container').innerHTML = '<p style="text-align: center; color: var(--accent-red);">لا توجد بيانات متاحة حالياً، يرجى التأكد من مسار الملف أو تشغيل السكربت لتوليد التقرير.</p>';
            }
        }

        function renderSignals(filter) {
            const container = document.getElementById('signals-container');
            container.innerHTML = '';

            let items = [];

            if (filter === 'bearish') {
                items = (marketData.bearish_signals || []).map(b => ({ ...b, isBearish: true }));
            } else {
                let bullish = (marketData.bullish_signals || []).map(s => ({ ...s, isBearish: false }));
                if (filter !== 'all') {
                    bullish = bullish.filter(s => s.timeframe && s.timeframe.toLowerCase() === filter);
                }
                items = bullish;
            }

            if (items.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد إشارات مطابقة لهذا الفلتر.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `signal-card ${item.isBearish ? 'bearish' : ''}`;
                
                if (item.isBearish) {
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="symbol">${item.symbol || ''}</span>
                            <span class="badge" style="background: rgba(239, 68, 68, 0.15); color: var(--accent-red);">${item.timeframe ? item.timeframe.toUpperCase() : ''}</span>
                        </div>
                        <div class="card-body">
                            <p><strong>النوع:</strong> ${item.type || ''}</p>
                            <p><strong>السعر الحالي:</strong> ${item.price || 0}$</p>
                            <p style="color: var(--accent-red); margin-top: 5px;">${item.message || ''}</p>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="symbol">${item.symbol || ''}</span>
                            <span class="badge">${item.timeframe ? item.timeframe.toUpperCase() : '1H'}</span>
                        </div>
                        <div class="card-body">
                            <p><strong>النوع:</strong> ${item.type || ''} | <strong>التقييم:</strong> ${item.stars || 'عالي'}</p>
                            <p><strong>السعر:</strong> ${item.price || 0} $ | <strong>وقف الخسارة:</strong> <span style="color: var(--accent-red);">${item.stop_loss || 0} $</span></p>
                            <div class="targets">
                                <span>T1: <strong>${item.target1 || 0}</strong></span>
                                <span>T2: <strong>${item.target2 || 0}</strong></span>
                                <span>البعيد: <strong style="color: var(--accent-green);">${item.macro_target || 0}</strong></span>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        function filterSignals(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSignals(type);
        }

        // تحميل البيانات عند فتح الصفحة
                async function loadMarketData() {
            try {
                // محاولة الجلب بعدة طرق لتجنب مشاكل المسارات في GitHub Pages
                let response = null;
                const possiblePaths = [
                    './market_status.json',
                    'market_status.json',
                    window.location.pathname.includes('/docs/') ? './market_status.json' : './docs/market_status.json'
                ];

                // تجربة المسارات بالترتيب
                for (let path of possiblePaths) {
                    try {
                        const res = await fetch(path + '?' + new Date().getTime());
                        if (res.ok) {
                            response = res;
                            break;
                        }
                    } catch (e) {
                        // متابعة التجربة للمسار التالي
                    }
                }

                if (!response || !response.ok) {
                    throw new Error('فشل جلب الملف من جميع المسارات المحتملة');
                }

                marketData = await response.json();
                
                // تحديث العدادات والوقت
                document.getElementById('bullish-count').textContent = marketData.bullish_signals_count || 0;
                document.getElementById('bearish-count').textContent = marketData.bearish_signals_count || 0;
                
                if (marketData.timestamp) {
                    const dateObj = new Date(marketData.timestamp);
                    document.getElementById('update-time').textContent = `آخر تحديث: ${dateObj.toLocaleString('ar-AE')}`;
                } else {
                    document.getElementById('update-time').textContent = 'آخر تحديث: متوفر';
                }

                renderSignals('all');
            } catch (error) {
                console.error('خطأ التحميل:', error);
                document.getElementById('update-time').textContent = 'فشل الاتصال بالملف';
                document.getElementById('signals-container').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--accent-red);">
                        <p>تعذر العثور على ملف البيانات (market_status.json).</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">تأكد من أن السكربت قام برفع الملف إلى نفس المجلد مع index.html.</p>
                    </div>`;
            }
                }
    </script>
</body>
</html>
