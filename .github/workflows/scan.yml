name: فحص العملات الحلال - V2 Shadow

on:
  schedule:
    # يعمل كل ساعة في الدقيقة 5
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: v2-shadow-scan
  cancel-in-progress: false

env:
  V2_BRANCH: "halal-crypto-intelligence/-(v2-Development)"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: سحب كود V2
        uses: actions/checkout@v4
        with:
          ref: "halal-crypto-intelligence/-(v2-Development)"
          fetch-depth: 0

      - name: استعادة حالة Shadow السابقة
        run: |
          if [ -f docs/shadow_outcomes.json ]; then
            cp docs/shadow_outcomes.json shadow_outcomes.json
            echo "تمت استعادة حالة Shadow السابقة."
          else
            echo '[]' > shadow_outcomes.json
            echo "لا توجد حالة Shadow سابقة؛ بدأنا بحالة فارغة."
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("shadow_outcomes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("shadow_outcomes.json must contain a JSON list")
          print(f"Shadow outcomes loaded: {len(data)}")
          PY

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install cachetools tenacity requests pandas blessed rich pytest

      - name: Release Gate - Shadow Outcome Tests
        run: python -m pytest -q tests/test_shadow_outcome_integration.py tests/test_shadow_state_persistence.py tests/test_shadow_history_reconciliation.py

      - name: تشغيل الماسح
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: تقرير Shadow بعد التشغيل
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("shadow_outcomes.json")
          if not path.exists():
              print("Shadow outcomes file not created by this scan.")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("shadow_outcomes.json must contain a JSON list")

          statuses = Counter(item.get("status", "missing") for item in data)
          resolved = [item for item in data if item.get("r_multiple") is not None]
          total_r = sum(float(item["r_multiple"]) for item in resolved)

          print(f"Shadow outcomes after scan: {len(data)}")
          print(f"Status counts: {dict(statuses)}")
          print(f"Resolved: {len(resolved)}")
          print(f"Total R: {total_r}")

          for item in resolved:
              print(
                  f"RESOLVED {item.get('symbol')} | "
                  f"{item.get('timeframe')} | "
                  f"{item.get('strategy')} | "
                  f"{item.get('status')} | "
                  f"R={item.get('r_multiple')} | "
                  f"bars={item.get('bars_observed')}"
              )
          PY

      - name: حفظ Shadow Outcomes
        run: |
          mkdir -p docs
          if [ -f shadow_outcomes.json ]; then
            cp shadow_outcomes.json docs/shadow_outcomes.json
            echo "تم حفظ shadow_outcomes.json في docs/."
          else
            echo "لم يتم إنشاء shadow_outcomes.json في هذه الدورة."
            echo '[]' > docs/shadow_outcomes.json
            echo "تم إنشاء ملف Shadow Outcomes فارغ لضمان وجود artifact ثابت."
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/shadow_outcomes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("shadow_outcomes.json must contain a JSON list")
          print(f"Shadow outcomes persisted: {len(data)}")
          PY

      - name: رفع Shadow Outcomes كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-shadow-outcomes
          path: docs/shadow_outcomes.json
          if-no-files-found: error
          retention-days: 7

      - name: حفظ بيانات Mini App على فرع V2
        run: |
          git config user.name "halal-scanner-bot"
          git config user.email "actions@github.com"
          mkdir -p docs
          git add docs/

          if ! git diff --staged --quiet; then
            git commit -m "تحديث بيانات الإشارات ونتائج Shadow V2 [تلقائي]"
            git push origin "HEAD:${V2_BRANCH}"
          else
            echo "لا توجد تغييرات جديدة للحفظ."
          fi
