name: فحص العملات الحلال

on:
  schedule:
    # يعمل كل ساعة في الدقيقة 5
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # مطلوب لمنح صلاحية حفظ وتحديث ملفات التقرير تلقائياً

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install cachetools requests pandas blessed


      - name: تشغيل الماسح
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: حفظ بيانات Mini App والتحديث التلقائي
        run: |
          git config user.name "halal-scanner-bot"
          git config user.email "actions@github.com"
          
          # إيجاد وإنشاء مجلد docs في حال عدم وجوده
          mkdir -p docs
          
          # إضافة جميع الملفات والبيانات التي تم توليدها داخل مجلد docs
          git add docs/
          
          # التحقق مما إذا كان هناك تغيير فعلي قبل عمل commit
          if ! git diff --staged --quiet; then
            git commit -m "تحديث بيانات الإشارات [تلقائي]"
            git pull --rebase origin main || true
            git push
          else
            echo "لا توجد تغييرات جديدة للحفظ."
          fi
