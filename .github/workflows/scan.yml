name: فحص العملات الحلال - V2 Shadow

on:
  schedule:
    # يعمل كل ساعة في الدقيقة 5
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  V2_BRANCH: "halal-crypto-intelligence/-(v2-Development)"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: سحب كود V2
        uses: actions/checkout@v4
        with:
          ref: "halal-crypto-intelligence/-(v2-Development)"
          fetch-depth: 0

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install cachetools tenacity requests pandas blessed rich

      - name: تشغيل الماسح
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: حفظ بيانات Mini App على فرع V2
        run: |
          git config user.name "halal-scanner-bot"
          git config user.email "actions@github.com"
          mkdir -p docs
          git add docs/

          if ! git diff --staged --quiet; then
            git commit -m "تحديث بيانات الإشارات V2 [تلقائي]"
            git push origin "HEAD:${V2_BRANCH}"
          else
            echo "لا توجد تغييرات جديدة للحفظ."
          fi
