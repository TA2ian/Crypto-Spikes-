name: فحص العملات الحلال

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # مطلوب لكي يتمكن البوت من حفظ ملفات docs/ تلقائياً

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install pandas requests

      - name: تشغيل الماسح
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: حفظ بيانات Mini App
        run: |
          git config user.name "halal-scanner-bot"
          git config user.email "actions@github.com"
          git add docs/signals.json docs/config.json docs/last_alerted.json
          git diff --staged --quiet || git commit -m "تحديث بيانات الإشارات [تلقائي]"
          git push
