name: V2 Shadow Scheduled Runner

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  V2_BRANCH: "halal-crypto-intelligence/-(v2-Development)"

concurrency:
  group: v2-shadow-scan
  cancel-in-progress: false

jobs:
  shadow_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: "halal-crypto-intelligence/-(v2-Development)"
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Shadow state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          if [ -f docs/shadow_outcomes.json ]; then
            cp docs/shadow_outcomes.json shadow_outcomes.json
          else
            printf '%s\n' '[]' > shadow_outcomes.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("shadow_outcomes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("shadow_outcomes.json must contain a JSON list")
          print(f"Loaded Shadow outcomes: {len(data)}")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install cachetools tenacity blessed rich pytest

      - name: Release Gate - Shadow
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_shadow_outcome_integration.py \
            tests/test_shadow_state_persistence.py \
            tests/test_shadow_history_reconciliation.py

      - name: Run V2 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python scanner.py

      - name: Validate and persist Shadow state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          test -f shadow_outcomes.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          source = Path("shadow_outcomes.json")
          target = Path("docs/shadow_outcomes.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("shadow_outcomes.json must contain a JSON list")

          statuses = Counter(item.get("status", "missing") for item in data)
          resolved = [item for item in data if item.get("r_multiple") is not None]
          total_r = sum(float(item["r_multiple"]) for item in resolved)

          target.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(f"Shadow outcomes: {len(data)}")
          print(f"Status counts: {dict(statuses)}")
          print(f"Resolved: {len(resolved)}")
          print(f"Total R: {total_r:.6f}")
          for item in resolved:
              print(
                  "RESOLVED "
                  f"{item.get('symbol')} | "
                  f"{item.get('timeframe')} | "
                  f"{item.get('strategy')} | "
                  f"{item.get('status')} | "
                  f"R={item.get('r_multiple')}"
              )
          PY

      - name: Upload Shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-shadow-outcomes
          path: docs/shadow_outcomes.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit Shadow state to V2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "halal-scanner-bot"
          git config user.email "actions@github.com"
          git add docs/shadow_outcomes.json docs/signals.json docs/market_status.json
          if git diff --cached --quiet; then
            echo "No Shadow state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist V2 Shadow state"
          git push origin "HEAD:${V2_BRANCH}"
